<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="记账">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0078FF">
<title>BudgetBook 记账</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--text2:#8e8e93;--sep:#e5e5ea;--blue:#0078FF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--tab-h:83px;--header-h:44px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:var(--tab-h)}
.header{position:sticky;top:0;z-index:100;background:rgba(242,242,247,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(var(--safe-top) + 8px) 20px 8px;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.2px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(249,249,249,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:8px 0 calc(var(--safe-bottom) + 4px);border-top:1px solid var(--sep);z-index:100}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text2);padding:4px 12px;cursor:pointer;transition:color .15s}
.tab-item.active{color:var(--blue)}
.tab-item svg{width:24px;height:24px}
.page{display:none;padding:12px 16px}
.page.active{display:block}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-row{display:flex;gap:12px}.card-row .card{flex:1}
.amount{font-size:34px;font-weight:700;letter-spacing:-1px}
.amount-sm{font-size:20px;font-weight:600;letter-spacing:-.5px}
.label{font-size:13px;color:var(--text2)}.label-sm{font-size:11px;color:var(--text2)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-primary{background:var(--blue);color:#fff;width:100%}
.btn-danger{background:var(--red);color:#fff}
.type-toggle{display:flex;background:var(--sep);border-radius:8px;padding:2px;margin-bottom:12px}
.type-toggle button{flex:1;padding:8px;border:none;background:none;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text2)}
.type-toggle button.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--sep);border-radius:8px;font-size:15px;outline:none;background:var(--bg)}
.form-group input:focus,.form-group select:focus{border-color:var(--blue)}
.cat-grid{display:flex;flex-wrap:wrap;gap:8px}
.cat-chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cat-chip.active{border-color:var(--blue)}
.txn-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--sep)}
.txn-item:last-child{border-bottom:none}
.txn-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.txn-info{flex:1}
.txn-info .txn-cat{font-size:15px;font-weight:500}.txn-info .txn-meta{font-size:12px;color:var(--text2)}
.txn-amount{font-size:16px;font-weight:600;cursor:pointer}
.txn-amount.expense{color:var(--red)}.txn-amount.income{color:var(--green)}
.bar-item{margin-bottom:6px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
.bar-track{flex:1;height:6px;background:var(--sep);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:rgba(0,0,0,.4);justify-content:center;align-items:center}
.modal.show{display:flex}
.modal-content{background:var(--card);border-radius:14px;padding:20px;width:calc(100% - 48px);max-width:380px;max-height:80vh;overflow-y:auto}
.section-title{font-size:16px;font-weight:600;margin-bottom:12px}
canvas{max-width:100%}
.fade-in{animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <div class="header" id="headerTitle">记账</div>
  <!-- 仪表盘 -->
  <div class="page active" id="page-dashboard">
    <div class="card" style="background:linear-gradient(135deg,#0078FF,#5856D6);color:#fff">
      <div class="label" style="color:rgba(255,255,255,.7)">当前余额</div>
      <div class="amount" id="dashBalance" style="font-size:40px">0.00</div>
      <div class="card-row" style="margin-top:12px">
        <div><div class="label-sm" style="color:rgba(255,255,255,.7)">收入</div><div class="amount-sm" id="dashIncome" style="color:#34C759">0.00</div></div>
        <div><div class="label-sm" style="color:rgba(255,255,255,.7)">支出</div><div class="amount-sm" id="dashExpense" style="color:#FF3B30">0.00</div></div>
      </div>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:12px">
      <div class="card fade-in" style="flex:1;text-align:center;cursor:pointer" onclick="switchTab('add')">
        <div style="font-size:28px;margin-bottom:4px">+</div><div style="font-size:13px">记一笔</div>
      </div>
      <div class="card fade-in" style="flex:1;text-align:center;cursor:pointer" onclick="switchTab('records')">
        <div style="font-size:28px;margin-bottom:4px">📋</div><div style="font-size:13px">查看记录</div>
      </div>
      <div class="card fade-in" style="flex:1;text-align:center;cursor:pointer" onclick="switchTab('stats')">
        <div style="font-size:28px;margin-bottom:4px">📊</div><div style="font-size:13px">统计</div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:600">预算使用情况</span>
    </div>
    <div id="budgetList"></div>
    <div style="font-weight:600;margin:16px 0 8px">最近交易</div>
    <div id="recentTxns"></div>
  </div>
  <!-- 记一笔 -->
  <div class="page" id="page-add">
    <div class="card">
      <div class="type-toggle"><button class="active" id="btnExpense" onclick="setAddType('expense')">支出</button><button id="btnIncome" onclick="setAddType('income')">收入</button></div>
      <div class="form-group"><label>金额</label><input type="number" id="addAmount" placeholder="0.00" inputmode="decimal"></div>
      <div class="form-group"><label>分类</label><div class="cat-grid" id="addCatList"></div></div>
      <div class="form-group"><label>备注(选填)</label><input type="text" id="addNote" placeholder="例如：午餐"></div>
      <div class="form-group"><label>日期</label><input type="date" id="addDate"></div>
      <button class="btn btn-primary btn-block" onclick="addTransaction()" style="margin-top:8px">✓ 记下这笔</button>
    </div>
  </div>
  <!-- 记录 -->
  <div class="page" id="page-records">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <button style="font-size:18px;padding:4px 8px;background:none;border:none;cursor:pointer" onclick="changeRecMonth(-1)">◀</button>
        <span style="font-weight:600" id="recordsMonthLabel"></span>
        <button style="font-size:18px;padding:4px 8px;background:none;border:none;cursor:pointer" onclick="changeRecMonth(1)">▶</button>
      </div>
      <div class="type-toggle"><button class="active" onclick="setRecFilter('all')">全部</button><button onclick="setRecFilter('expense')">支出</button><button onclick="setRecFilter('income')">收入</button></div>
      <div id="recordsList"></div>
    </div>
  </div>
  <!-- 统计 -->
  <div class="page" id="page-stats">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <button style="font-size:18px;padding:4px 8px;background:none;border:none;cursor:pointer" onclick="changeStatsMonth(-1)">◀</button>
      <span style="font-weight:600" id="statsMonthLabel"></span>
      <button style="font-size:18px;padding:4px 8px;background:none;border:none;cursor:pointer" onclick="changeStatsMonth(1)">▶</button>
    </div>
    <div class="card"><div style="font-weight:600;font-size:16px;margin-bottom:12px">支出分类占比</div><canvas id="pieChart" height="220"></canvas></div>
    <div class="card"><div style="font-weight:600;font-size:16px;margin-bottom:12px">近12月趋势</div><canvas id="trendChart" height="200"></canvas></div>
  </div>
  <!-- 设置 -->
  <div class="page" id="page-settings">
    <div class="card"><div style="font-weight:600;font-size:16px;margin-bottom:12px">月度预算</div>
      <div class="form-group"><label>每月预算金额</label><input type="number" id="budgetAmount" placeholder="0.00" inputmode="decimal"></div>
      <button class="btn btn-primary" style="width:100%" onclick="saveBudget()">保存预算</button>
    </div>
    <div class="card">
      <div style="font-weight:600;font-size:16px;margin-bottom:12px">自定义分类</div>
      <div class="type-toggle" style="margin-bottom:12px"><button class="active" onclick="setCatType('expense')">支出</button><button onclick="setCatType('income')">收入</button></div>
      <div id="catManageList" style="margin-bottom:12px"></div>
      <div style="margin-top:8px;display:flex;gap:8px"><input type="text" id="newCatName" placeholder="新分类名称" style="flex:1;padding:8px 12px;border:1px solid var(--sep);border-radius:8px;font-size:14px;outline:none"><button class="btn btn-primary" style="width:auto;padding:8px 16px" onclick="addCategory()">添加</button></div>
    </div>
    <button class="btn btn-danger" style="width:100%;margin-top:20px" onclick="resetAll()">重置所有数据</button>
  </div>
</div>
<!-- 底部导航 -->
<div class="tabbar">
  <div class="tab-item active" id="tab-dashboard" onclick="switchTab('dashboard')">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
    <span>首页</span>
  </div>
  <div class="tab-item" id="tab-records" onclick="switchTab('records')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
    <span>记录</span>
  </div>
  <div class="tab-item" id="tab-add" onclick="switchTab('add')">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span>记一笔</span>
  </div>
  <div class="tab-item" id="tab-stats" onclick="switchTab('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
    <span>统计</span>
  </div>
  <div class="tab-item" id="tab-settings" onclick="switchTab('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    <span>设置</span>
  </div>
</div>
<!-- 编辑弹窗 -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <div class="section-title" id="editModalTitle">编辑交易</div>
    <div class="form-group"><label>金额</label><input type="number" id="editAmount" step="0.01" inputmode="decimal"></div>
    <div class="form-group"><label>备注</label><input type="text" id="editNote"></div>
    <div class="form-group"><label>日期</label><input type="date" id="editDate"></div>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-danger" style="flex:1" id="btnDeleteTxn">删除</button><button class="btn btn-primary" style="flex:1" id="btnSaveTxn">保存</button></div>
  </div>
</div>
<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ===== 数据 =====
const PE=[{n:'餐饮',i:'🍔',c:'#FF6B6B'},{n:'交通',i:'🚗',c:'#4ECDC4'},{n:'购物',i:'🛒',c:'#FF9F43'},{n:'娱乐',i:'🎮',c:'#A29BFE'},{n:'居住',i:'🏠',c:'#FDCB6E'},{n:'其它',i:'📌',c:'#B2BEC3'}];
const PI=[{n:'工资',i:'💼',c:'#00B894'},{n:'兼职',i:'💰',c:'#6C5CE7'},{n:'理财',i:'📈',c:'#0984E3'},{n:'退款',i:'💳',c:'#E17055'},{n:'其它',i:'📌',c:'#B2BEC3'}];
let D=JSON.parse(localStorage.getItem('bb_data')||'{}');
if(!D.txs)D.txs=[];if(!D.cc)D.cc=[];if(!D.bg)D.bg={};
let CT='expense',AT='expense',RT=null,RYM=null,RF='all',SYM=null,CMT='expense',ETID=null;
let pieChart=null,trendChart=null;
function S(){localStorage.setItem('bb_data',JSON.stringify(D))}
function NYM(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function GTXM(ym){return D.txs.filter(t=>t.date.startsWith(ym))}
function YL(ym){let[p,y,m]=ym.split('-');return y+'年'+parseInt(m)+'月'}
function AC(type){let preset=type==='expense'?PE:PI,presetNames=preset.map(c=>c.n),custom=D.cc.filter(c=>c.type===type),all=[...preset.map(c=>({...c,builtin:true})),...custom];return all}
function GC(type,n){let all=AC(type);return all.find(c=>c.n===n)}
function UID(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function FA(n){return n<0?'-'+Math.abs(n).toFixed(2):n.toFixed(2)}

function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
  let page=document.getElementById('page-'+tab);
  if(page)page.classList.add('active');
  let tabEl=document.getElementById('tab-'+tab);
  if(tabEl)tabEl.classList.add('active');
  let titles={dashboard:'记账',add:'记一笔',records:'交易记录',stats:'统计分析',settings:'设置'};
  document.getElementById('headerTitle').textContent=titles[tab]||'记账';
  if(tab==='dashboard')RD();
  if(tab==='records'){if(!RYM)RYM=NYM();RR()}
  if(tab==='stats'){if(!SYM)SYM=NYM();RS()}
  if(tab==='add')RCL();
  if(tab==='settings'){RBL();RCM();}
}

function RD(){
  let txns=D.txs,inc=txns.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  let exp=txns.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  document.getElementById('dashBalance').textContent=FA(inc-exp);
  document.getElementById('dashIncome').textContent=FA(inc);
  document.getElementById('dashExpense').textContent=FA(exp);
  RBL();
  let recent=[...txns].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,5);
  let h='';
  recent.forEach(t=>{
    let cat=GC(t.type,t.cat)||{i:'📌',c:'#B2BEC3'};
    h+='<div class="txn-item" onclick="openEdit(\''+t.id+'\')"><div class="txn-icon" style="background:'+cat.c+'22;color:'+cat.c+'">'+cat.i+'</div><div class="txn-info"><div class="txn-cat">'+t.cat+'</div><div class="txn-meta">'+t.date+'</div></div><div class="txn-amount '+(t.type==='expense'?'expense':'income')+'">'+(t.type==='expense'?'-':'+')+t.amount.toFixed(2)+'</div></div>';
  });
  document.getElementById('recentTxns').innerHTML=h||'<div style="text-align:center;color:var(--text2);padding:20px">暂无记录</div>';
}

function RBL(){
  let cats=AC('expense'),ym=NYM(),h='';
  cats.forEach(c=>{
    let key=ym+'_'+c.n,limit=D.bg[c.n]||0;
    let spent=GTXM(ym).filter(t=>t.type==='expense'&&t.cat===c.n).reduce((s,t)=>s+t.amount,0);
    let pct=limit>0?Math.min(100,Math.round(spent/limit*100)):0;
    let color=pct>90?'#FF3B30':pct>70?'#FF9500':'#34C759';
    h+='<div class="bar-item"><div class="bar-row"><span>'+c.i+' '+c.n+'</span><span style="margin-left:auto">'+spent.toFixed(0)+'/'+(limit||'--')+'</span></div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div></div>';
  });
  document.getElementById('budgetList').innerHTML=h||'<div style="color:var(--text2);font-size:13px">请在设置中配置预算</div>';
}

function setAddType(t){AT=t;document.getElementById('btnExpense').classList.toggle('active',t==='expense');document.getElementById('btnIncome').classList.toggle('active',t==='income');RCL()}
function RCL(){
  let cats=AC(AT),h='';
  cats.forEach(c=>{
    h+='<div class="cat-chip '+(CT===c.n?'active':'')+'" style="background:'+c.c+'15;color:'+c.c+'" onclick="document.querySelectorAll(\'.cat-chip\').forEach(x=>x.classList.remove(\'active\'));this.classList.add(\'active\');CT=\''+c.n+'\'">'+c.i+' '+c.n+'</div>';
  });
  document.getElementById('addCatList').innerHTML=h;
  if(!cats.find(c=>c.n===CT))CT=cats[0]?cats[0].n:'';
}

function addTransaction(){
  let amt=parseFloat(document.getElementById('addAmount').value);
  if(isNaN(amt)||amt<=0){alert('请输入有效金额');return}
  if(!CT){alert('请选择分类');return}
  let note=document.getElementById('addNote').value.trim();
  let date=document.getElementById('addDate').value||new Date().toISOString().slice(0,10);
  D.txs.push({id:UID(),type:AT,cat:CT,amount:amt,note:note,date:date});
  S();document.getElementById('addAmount').value='';document.getElementById('addNote').value='';
  let amtEl=document.getElementById('addAmount'),btn=document.querySelector('#page-add .btn-primary');
  amtEl.style.transform='scale(1.1)';btn.textContent='✓ 已记下!';
  setTimeout(()=>{amtEl.style.transform='';btn.textContent='✓ 记下这笔'},800);
  RD();
}

function changeRecMonth(d){let[p,y,m]=RYM.split('-');let dt=new Date(parseInt(y),parseInt(m)-1+d);RYM=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');RR()}
function setRecFilter(f){RF=f;document.querySelectorAll('#page-records .type-toggle button').forEach((b,i)=>{b.classList.toggle('active',(i===0&&f==='all')||(i===1&&f==='expense')||(i===2&&f==='income'))});RR()}
function RR(){
  document.getElementById('recordsMonthLabel').textContent=YL(RYM);
  let txns=GTXM(RYM);
  if(RF==='expense')txns=txns.filter(t=>t.type==='expense');
  if(RF==='income')txns=txns.filter(t=>t.type==='income');
  txns.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  let total=txns.reduce((s,t)=>s+(t.type==='expense'?-t.amount:t.amount),0);
  let h='<div style="text-align:center;padding:8px;font-weight:600;font-size:18px;color:'+(total>=0?'var(--green)':'var(--red)')+'">合计: '+(total>=0?'+':'')+total.toFixed(2)+'</div>';
  txns.forEach(t=>{
    let cat=GC(t.type,t.cat)||{i:'📌',c:'#B2BEC3'};
    h+='<div class="txn-item" onclick="openEdit(\''+t.id+'\')"><div class="txn-icon" style="background:'+cat.c+'22;color:'+cat.c+'">'+cat.i+'</div><div class="txn-info"><div class="txn-cat">'+t.cat+(t.note?' - '+t.note:'')+'</div><div class="txn-meta">'+t.date+'</div></div><div class="txn-amount '+(t.type==='expense'?'expense':'income')+'">'+(t.type==='expense'?'-':'+')+t.amount.toFixed(2)+'</div></div>';
  });
  document.getElementById('recordsList').innerHTML=h||'<div style="text-align:center;color:var(--text2);padding:20px">暂无记录</div>';
}

function changeStatsMonth(d){let[p,y,m]=SYM.split('-');let dt=new Date(parseInt(y),parseInt(m)-1+d);SYM=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');RS()}
function RS(){
  document.getElementById('statsMonthLabel').textContent=YL(SYM);
  let txns=GTXM(SYM).filter(t=>t.type==='expense');
  // 饼图
  let catMap={};
  txns.forEach(t=>{catMap[t.cat]=(catMap[t.cat]||0)+t.amount});
  let labels=Object.keys(catMap),data=Object.values(catMap);
  let colors=labels.map(n=>{let c=GC('expense',n);return c?c.c:'#B2BEC3'});
  if(pieChart)pieChart.destroy();
  let pctx=document.getElementById('pieChart').getContext('2d');
  pieChart=new Chart(pctx,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12}}}}});
  // 趋势图
  let months=[],expData=[],incData=[];
  for(let i=11;i>=0;i--){
    let d=new Date(parseInt(SYM.split('-')[0]),parseInt(SYM.split('-')[1])-1-i);
    let ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    months.push(d.getMonth()+1+'月');
    expData.push(D.txs.filter(t=>t.date.startsWith(ym)&&t.type==='expense').reduce((s,t)=>s+t.amount,0));
    incData.push(D.txs.filter(t=>t.date.startsWith(ym)&&t.type==='income').reduce((s,t)=>s+t.amount,0));
  }
  if(trendChart)trendChart.destroy();
  let tctx=document.getElementById('trendChart').getContext('2d');
  trendChart=new Chart(tctx,{type:'bar',data:{labels:months,datasets:[{label:'支出',data:expData,backgroundColor:'#FF3B30'},{label:'收入',data:incData,backgroundColor:'#34C759'}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12}}},scales:{y:{beginAtZero:true}}}});
}

function setCatType(t){CMT=t;document.querySelectorAll('#page-settings .type-toggle button').forEach((b,i)=>{b.classList.toggle('active',(i===0&&t==='expense')||(i===1&&t==='income'))});RCM()}
function RCM(){
  let cats=AC(CMT),preset=CMT==='expense'?PE:PI,pn=preset.map(c=>c.n),h='';
  cats.forEach(c=>{
    let isPreset=pn.includes(c.n);
    h+='<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--sep)"><span>'+c.i+'</span><span style="flex:1">'+c.n+'</span>'+(isPreset?'<span style="font-size:11px;color:var(--text2)">预设</span>':'<button class="btn" style="background:var(--red);color:#fff;padding:4px 10px;font-size:12px;border-radius:6px" onclick="DC(\''+c.n+'\')">删除</button>')+'</div>';
  });
  document.getElementById('catManageList').innerHTML=h;
}

function addCategory(){
  let n=document.getElementById('newCatName').value.trim();
  if(!n){alert('请输入分类名称');return}
  if(AC(CMT).find(c=>c.n===n)){alert('分类已存在');return}
  D.cc.push({n:n,type:CMT,i:'📌',c:'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')});
  S();document.getElementById('newCatName').value='';RCM();RCL();
}

function DC(n){
  if(!confirm('确定删除分类"'+n+'"? 不会删除已有交易记录。'))return;
  D.cc=D.cc.filter(c=>!(c.n===n&&c.type===CMT));
  S();RCM();RCL();
}

function saveBudget(){
  let amt=parseFloat(document.getElementById('budgetAmount').value);
  let cats=AC('expense');
  cats.forEach(c=>{D.bg[c.n]=isNaN(amt)?0:amt});
  S();RBL();document.getElementById('budgetAmount').value='';alert('预算已保存');
}

function openEdit(id){
  let tx=D.txs.find(t=>t.id===id);if(!tx)return;
  ETID=id;document.getElementById('editAmount').value=tx.amount;
  document.getElementById('editNote').value=tx.note||'';
  document.getElementById('editDate').value=tx.date;
  document.getElementById('editModalTitle').textContent='编辑交易';
  document.getElementById('editModal').classList.add('show');
  document.getElementById('btnDeleteTxn').onclick=()=>{if(confirm('确定删除此记录?')){D.txs=D.txs.filter(t=>t.id!==ETID);S();closeEdit();RD();if(document.getElementById('page-records').classList.contains('active'))RR();}};
  document.getElementById('btnSaveTxn').onclick=()=>{let t=D.txs.find(t=>t.id===ETID);if(!t)return;t.amount=parseFloat(document.getElementById('editAmount').value)||0;t.note=document.getElementById('editNote').value.trim();t.date=document.getElementById('editDate').value;S();closeEdit();RD();if(document.getElementById('page-records').classList.contains('active'))RR();if(document.getElementById('page-stats').classList.contains('active'))RS();};
}

function closeEdit(){document.getElementById('editModal').classList.remove('show');ETID=null}
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeEdit()});

function resetAll(){
  if(confirm('确定要删除所有数据吗？此操作不可恢复！')){
    D={txs:[],cc:[],bg:{}};S();RD();RR();RS();RBL();RCM();RCL();
    if(pieChart)pieChart.destroy();if(trendChart)trendChart.destroy();
    pieChart=null;trendChart=null;
  }
}

// 初始化
document.getElementById('addDate').value=new Date().toISOString().slice(0,10);
RCL();RD();
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{})}
</script>
</body>
